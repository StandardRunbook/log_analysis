name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check compilation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # The lib does include_str!("../hover-schema/clickhouse_schema.sql") at
    # build time, so the hover-schema submodule must be present. Skip the
    # data/loghub-2.0 submodule (benchmark dataset, ~hundreds of MB) — it's
    # not needed for unit tests.
    - name: Init hover-schema submodule
      run: git submodule update --init hover-schema

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check compilation
      run: cargo check --all-targets

    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Check formatting
      run: cargo fmt -- --check

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # The lib does include_str!("../hover-schema/clickhouse_schema.sql") at
    # build time, so the hover-schema submodule must be present. Skip the
    # data/loghub-2.0 submodule (benchmark dataset, ~hundreds of MB) — it's
    # not needed for unit tests.
    - name: Init hover-schema submodule
      run: git submodule update --init hover-schema

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Run tests with coverage
      run: cargo llvm-cov --all-targets --workspace --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        flags: rust
        fail_ci_if_error: false

  build:
    name: Build release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # The lib does include_str!("../hover-schema/clickhouse_schema.sql") at
    # build time, so the hover-schema submodule must be present. Skip the
    # data/loghub-2.0 submodule (benchmark dataset, ~hundreds of MB) — it's
    # not needed for unit tests.
    - name: Init hover-schema submodule
      run: git submodule update --init hover-schema

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release
      run: cargo build --release --all-targets
